<div id="move-stock-section" class="metal-card mt-3 mb-3">
    <h5 class="mb-3 mt-3 text-uppercase h5-header" style="color: #666;">Move Stock Items</h5>

    <div class="form-group">
        <label class="form-label" for="target-location">Select Destination Location:</label>

        <select id="target-location" class="form-control">
            <option>----</option>

            {% for loc in all_locations %}
                <option value="{{ loc.id }}">{{ loc.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label class="form-label" for="target-location">New Destination Location:</label>

        <input type="text" id="create-location" class="form-control">
    </div>
    
    <button type="button" class="btn btn-syncroth mt-3" id="confirm-move-btn">Submit Move</button>

    <div class="form-check mt-3" style="margin-bottom: 10px;">
        <input type="checkbox" class="form-check-input" id="dry-run-checkbox" checked>

        <label class="form-label form-check-label" for="dry-run-checkbox">Dry Run (No changes will be made)</label>
    </div>
</div>
