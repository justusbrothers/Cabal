<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cabal Portal</title>
        {% load static %}
        <link href="{% static 'plugins/cabal/cabal/css/cabal/cabal.css' %}" rel="stylesheet">
    </head>

    <body>

        <header class="portal-header">
            <div class="portal-title">CABAL PORTAL</div>
            <ul class="nav-tabs" id="tabList">
                <li>
                    <button class="nav-tab-btn active" data-target="tab-nexus">
                        Nexus
                    </button>
                </li>
                <li>
                    <button class="nav-tab-btn" data-target="tab-vanguard">
                        Vanguard
                    </button>
                </li>
                <li>
                    <button class="nav-tab-btn" data-target="tab-syncroth">
                        Syncroth
                    </button>
                </li>
                <!-- <li>
                    <button class="nav-tab-btn" data-target="tab-spectacle">
                        Spectacle
                    </button>
                </li> -->
                <li>
                    <button class="nav-tab-btn" data-target="tab-cerebro">
                        Cerebro
                    </button>
                </li>
                <li>
                    <button class="nav-tab-btn" data-target="tab-avisia">
                        Avisia
                    </button>
                </li>
            </ul>
        </header>

        <main class="portal-viewport">
            <iframe 
                id="tab-nexus" 
                class="tab-panel active" 
                src="{% url 'plugin:cabal:nexus' %}"
                loading="lazy">
            </iframe>

            <iframe 
                id="tab-vanguard" 
                class="tab-panel" 
                src="{% url 'plugin:cabal:vanguard' %}"
                loading="lazy">
            </iframe>

            <iframe 
                id="tab-syncroth" 
                class="tab-panel" 
                src="{% url 'plugin:cabal:syncroth' %}"
                loading="lazy">
            </iframe>

            <!-- <iframe 
                id="tab-spectacle" 
                class="tab-panel" 
                src="{% url 'plugin:cabal:spectacle' %}"
                loading="lazy">
            </iframe> -->

            <iframe 
                id="tab-cerebro" 
                class="tab-panel" 
                src="{% url 'plugin:cabal:cerebro' %}"
                loading="lazy">
            </iframe>

            <iframe 
                id="tab-avisia" 
                class="tab-panel" 
                src="{% url 'plugin:cabal:avisia' %}"
                loading="lazy">
            </iframe>
        </main>

        <script src="{% static 'plugins/cabal/cabal/js/cabal/cabal.js' %}"></script>
    </body>
</html>
