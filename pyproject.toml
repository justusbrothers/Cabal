# /plugins/Cabal/pyproject.toml

# This file is used to package the Cabal plugin.
#
# - It was generated by the InvenTree Plugin Creator tool - version 1.20.0
# - Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-cabal"
description = "JustUs Brothers comic management tools"
dynamic = ["version"]
authors = [
    { name = "JustUs Brothers", email = "info@justusbrothers.shop" },
]
readme = "README.md"
license = { text = "MIT" }
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    "mokkari>=4.0.0",
    "reportlab>=4.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]

[project.urls]
Homepage = "https://justusbrothers.shop"

[project.entry-points."inventree_plugins"]
Cabal = "cabal.core:Cabal"

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools.dynamic]
version = { attr = "cabal.PLUGIN_VERSION" }

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cabal"]

[tool.mypy]
python_version = "3.11"
files = ["cabal"]
explicit_package_bases = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
