# /plugins/Cabal/pyproject.toml

# This file is used to package the Cabal plugin.
#
# - It was generated by the InvenTree Plugin Creator tool - version 1.20.0
# - Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-cabal"
description = "JustUs Brothers comic management tools"
dynamic = ["version"]
authors = [
    { name = "JustUs Brothers", email = "info@justusbrothers.shop" },
]
readme = "README.md"
license = { text = "MIT" }
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    "mokkari>=4.0.0",
    "reportlab>=4.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]

[project.urls]
Homepage = "https://justusbrothers.shop"

[project.entry-points."inventree_plugins"]
Cabal = "cabal.core:Cabal"

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools.dynamic]
version = { attr = "cabal.PLUGIN_VERSION" }

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src = ["cabal"]
